services:

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: poc-clickhouse
    restart: unless-stopped

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: kjt
      CLICKHOUSE_PASSWORD: kjt_clickhouse_poc
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    volumes:
      - ./clickhouse/data:/var/lib/clickhouse:Z
      - ./clickhouse/logs:/var/log/clickhouse-server:Z


  kafka:
    image: apache/kafka:4.3.1
    container_name: poc-kafka
    hostname: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      # This one node performs both Kafka roles for our POC.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Three listeners:
      # INTERNAL   = other Docker containers
      # EXTERNAL   = this RHEL host
      # CONTROLLER = KRaft internal controller traffic
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Required because this is only one broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Persistent event log location.
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - ./kafka/data:/var/lib/kafka/data:Z


  kafbat:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: poc-kafbat
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: cdc-poc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

    depends_on:
      - kafka


  debezium:
    image: quay.io/debezium/connect:3.6
    container_name: poc-debezium
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092

      GROUP_ID: cdc-poc-connect

      CONFIG_STORAGE_TOPIC: cdc_poc_connect_configs
      OFFSET_STORAGE_TOPIC: cdc_poc_connect_offsets
      STATUS_STORAGE_TOPIC: cdc_poc_connect_status

      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

    depends_on:
      - kafka

  oracle:
    image: gvenzl/oracle-free@sha256:e2763af84ecc345d48e4e3fe7999d0b7bb57885b6e0166051acd5f62e27eb605
    container_name: poc-oracle
    hostname: oracle
    restart: unless-stopped

    ports:
      - "1521:1521"

    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}

    shm_size: "1g"

    volumes:
      - ./oracle/oradata:/opt/oracle/oradata:Z

    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s